[package]
name = "pdfnotator"
version = "0.8.3"
description = "PDF viewer for pair-designing Typst documents with AI coding agents via MCP"
authors = ["Thomas Oberbichler"]
license = "ISC"
# repository = "https://github.com/<owner>/pdfnotator"  # set before publishing
edition = "2024"
rust-version = "1.88"

[lib]
name = "pdfnotator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
axum = "0.8"
base64 = "0.23"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
ureq = { version = "3", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
local-ip-address = "0.6.13"
tokio-stream = { version = "0.1.19", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
